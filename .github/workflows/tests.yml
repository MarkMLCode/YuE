name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - name: Install CPU runtime and tests
        run: |
          uv venv --python 3.12
          uv pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install '.[test]'
      - name: Check public commands
        run: |
          .venv/bin/yue2 --help
          .venv/bin/yue2 generate --help
          .venv/bin/yue2 batch --help
          .venv/bin/yue2 doctor
      - name: Run tests without model downloads
        run: .venv/bin/python -m pytest -q
      - name: Check instrumental workflow and portable bundle
        run: |
          .venv/bin/python -B skills/yue2-music/instrumental/scripts/test_tools.py
          .venv/bin/python -B tools/build_release.py --skill-only --output /tmp/yue2-skill-dist
